name: Deploy site

# Runs on every push to main, every 3 hours (to pick up menu edits in the Google
# Sheet), on demand from the Actions tab, and when the sheet pings the repo.
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [sheet-updated]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The sheet id only gives view access to the (public) menu, so it can live
      # here; a repository variable SHEET_ID overrides it.
      - name: Pull the menu from the Google Sheet
        env:
          SHEET_SOURCE: live
          SHEET_ID: ${{ vars.SHEET_ID || '1FBxTn4KD7cl6dJHatqiGDM0f39d8enKicpn4xK-KODI' }}
        run: node scripts/sync-sheet.mjs

      - name: Save the menu snapshot
        id: snapshot
        run: |
          if git diff --quiet -- src/data/menu.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git add src/data/menu.json
            git commit -m "Update menu from Google Sheet"
            # main may have moved since checkout (e.g. a push during this run).
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Scheduled checks only rebuild when the sheet actually changed.
      - name: Decide whether to deploy
        id: gate
        run: echo "deploy=${{ github.event_name != 'schedule' || steps.snapshot.outputs.changed == 'true' }}" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.deploy == 'true'
        run: npm run build
      - if: steps.gate.outputs.deploy == 'true'
        uses: actions/configure-pages@v6
      - if: steps.gate.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Load the live site after each deploy and fail loudly if a page or asset is missing.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check live pages and assets
        run: |
          base="https://dfitch8899.github.io/goodneighborbakehouse"
          sleep 20
          fail=0
          check() { code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 "$1"); echo "$code $1"; [ "$code" = "$2" ] || fail=1; }
          check "$base/" 200
          check "$base/faq/" 200
          check "$base/og.png" 200
          check "$base/does-not-exist/" 404
          curl -s "$base/" -o home.html
          grep -q 'A little sweetness' home.html || { echo "home page content missing"; fail=1; }
          for u in $(grep -oE '/goodneighborbakehouse/_astro/[^" )]+\.(woff2|avif|webp)' home.html | sort -u | head -12); do
            check "https://dfitch8899.github.io$u" 200
          done
          exit $fail
