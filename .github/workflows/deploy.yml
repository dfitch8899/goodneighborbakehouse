name: Deploy site

# Runs on every push to main, every 3 hours (to pick up menu edits in the Google
# Sheet), on demand from the Actions tab, and when the sheet pings the repo.
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [sheet-updated]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Pull the menu from the Google Sheet
        if: vars.SHEET_ID != ''
        env:
          SHEET_SOURCE: live
          SHEET_ID: ${{ vars.SHEET_ID }}
        run: node scripts/sync-sheet.mjs

      - name: Save the menu snapshot
        run: |
          if ! git diff --quiet -- src/data/menu.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git add src/data/menu.json
            git commit -m "Update menu from Google Sheet"
            git push
          fi

      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
